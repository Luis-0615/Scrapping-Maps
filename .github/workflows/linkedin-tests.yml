name: Testes do coletor LinkedIn

on:
  push:
    paths:
      - 'linkedin/**'
      - '.github/workflows/linkedin-tests.yml'
  pull_request:
    paths:
      - 'linkedin/**'
      - '.github/workflows/linkedin-tests.yml'

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: python -m pip install -r linkedin/requirements-dev.txt
      - name: Compilar
        run: python -m py_compile linkedin/scrapping_linkedin.py
      - name: Testar
        run: python -m pytest -q linkedin/tests
